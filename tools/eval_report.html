<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAST Scanner Evaluation</title>
<!--
  View of eval_report.json written by tools/eval_report.py.

  tools/eval_report.py --out <dir> writes a copy of this file as
  <dir>/eval_report.html with the report embedded in the script element
  below, so it opens straight from disk. This template on its own looks for
  the data in three places, in order: the embedded element, eval_report.json
  next to the page (works when the folder is served over HTTP), then a file
  picker. Self-contained: no external scripts, fonts or styles.

  Layout follows the client requirement (Sensitive Data and Excessive Agency
  Detector, eval data requirement v3): the four measurements each task must
  support (1 risk detection, 2 reachability and path tracing, 3 mitigation
  detection, 4 mitigation recommendation), then the ambiguous negatives, the
  repository families (positive and negative twin), the taxonomy categories
  and the scanner output.
-->
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f3f2ee;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6d68;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --tool-1: #2a78d6;
  --tool-2: #eb6834;
  --tool-3: #1baf7a;
  --tool-4: #4a3aa7;
  --good: #0ca30c;
  --good-ink: #006300;
  --warning: #fab219;
  --critical: #d03b3b;
  --critical-ink: #b42323;
  --track: #ecebe6;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #222220;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #9a988f;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --tool-1: #3987e5;
    --tool-2: #d95926;
    --tool-3: #199e70;
    --tool-4: #9085e9;
    --good-ink: #0ca30c;
    --critical-ink: #e66767;
    --track: #2a2a28;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #222220;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #9a988f;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --tool-1: #3987e5;
  --tool-2: #d95926;
  --tool-3: #199e70;
  --tool-4: #9085e9;
  --good-ink: #0ca30c;
  --critical-ink: #e66767;
  --track: #2a2a28;
  --shadow: none;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 64px; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
a { color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
header.top {
  position: sticky; top: 0; z-index: 5; background: var(--page);
  border-bottom: 1px solid var(--border);
}
header.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 52px; flex-wrap: wrap; }
header.top .brand { font-weight: 650; white-space: nowrap; }
nav.sections { display: flex; gap: 4px; overflow-x: auto; flex: 1; scrollbar-width: none; }
nav.sections a {
  text-decoration: none; color: var(--ink-2); font-size: 13px; padding: 6px 10px;
  border-radius: 6px; white-space: nowrap;
}
nav.sections a:hover { background: var(--surface-2); color: var(--ink); }
.theme-btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer;
}
main { padding: 24px 0 64px; }
h1 { font-size: 26px; line-height: 1.25; margin: 8px 0 6px; font-weight: 650; }
h2 { font-size: 20px; margin: 0 0 4px; font-weight: 650; }
h3 { font-size: 15px; margin: 18px 0 8px; font-weight: 650; }
.sub { color: var(--ink-2); margin: 0 0 4px; }
.small { font-size: 13px; color: var(--muted); }
section.block {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 20px; margin: 18px 0; box-shadow: var(--shadow);
}
.kicker { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--ink-2); max-width: 820px; margin: 4px 0 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border);
  background: var(--surface); border-radius: 999px; padding: 4px 12px 4px 8px; font-size: 13px;
  cursor: pointer; user-select: none; color: var(--ink);
}
.chip[aria-pressed="false"] { opacity: .45; }
.chip .meta { color: var(--muted); }
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 14px 0 4px; }
.tile { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; background: var(--surface); }
.tile .v { font-size: 26px; font-weight: 650; line-height: 1.2; }
.tile .l { font-size: 13px; color: var(--ink-2); }
.callout {
  border-left: 3px solid var(--warning); background: var(--surface-2); border-radius: 0 8px 8px 0;
  padding: 10px 14px; margin: 14px 0;
}
.callout ul { margin: 6px 0 0; padding-left: 18px; }
.callout li { margin: 3px 0; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
.toolhead { display: inline-flex; align-items: center; gap: 6px; }
.meter { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.meter .bar { flex: 1; height: 8px; background: var(--track); border-radius: 4px; position: relative; min-width: 70px; }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.meter .val { font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; font-size: 13px; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; white-space: nowrap; }
.status .ic { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
.status.ok .ic { background: var(--good); }
.status.ok { color: var(--good-ink); }
.status.bad .ic { background: var(--critical); }
.status.bad { color: var(--critical-ink); }
.status.na { color: var(--muted); }
.status.na .ic { background: var(--axis); color: var(--ink); }
.note { font-size: 13px; color: var(--ink-2); margin: 10px 0 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.chart { width: 100%; max-width: 720px; height: auto; display: block; }
.chart text { fill: var(--ink-2); font-size: 12px; font-family: inherit; }
.chart .lbl { fill: var(--ink); }
.chart .gridline { stroke: var(--grid); }
.chart .axisline { stroke: var(--axis); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink-2); margin: 6px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
details.fam { border-bottom: 1px solid var(--grid); }
details.fam > summary { cursor: pointer; list-style: none; padding: 10px 4px; display: grid; gap: 10px; align-items: center; }
details.fam > summary::-webkit-details-marker { display: none; }
details.fam > summary:hover { background: var(--surface-2); }
details.fam .body { padding: 4px 4px 14px 24px; }
.caret { display: inline-block; transition: transform .15s; color: var(--muted); }
details[open] .caret { transform: rotate(90deg); }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); margin: 1px 4px 1px 0; white-space: nowrap; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; word-break: break-all; }
.empty { color: var(--muted); font-style: italic; }
#tip {
  position: fixed; pointer-events: none; z-index: 20; background: var(--ink); color: var(--page);
  font-size: 12px; padding: 6px 8px; border-radius: 6px; max-width: 320px; display: none; line-height: 1.4;
}
.loader { max-width: 560px; margin: 80px auto; text-align: center; }
.loader input { margin-top: 12px; }
footer { color: var(--muted); font-size: 13px; padding: 8px 0 40px; }
@media (max-width: 640px) {
  h1 { font-size: 21px; }
  section.block { padding: 14px; }
  header.top .brand { display: none; }
}
@media print {
  header.top { position: static; }
  details.fam { break-inside: avoid; }
}
</style>
</head>
<body>
<script id="report-data" type="application/json">null</script>
<header class="top">
  <div class="wrap">
    <span class="brand">SAST Scanner Evaluation</span>
    <nav class="sections" aria-label="Sections">
      <a href="#overview">Overview</a>
      <a href="#m1">1 Risk detection</a>
      <a href="#m2">2 Path tracing</a>
      <a href="#m3">3 Mitigation detection</a>
      <a href="#m4">4 Recommendation</a>
      <a href="#negatives">Ambiguous negatives</a>
      <a href="#families">Families</a>
      <a href="#taxonomy">Taxonomy</a>
      <a href="#output">Scanner output</a>
      <a href="#method">Method</a>
    </nav>
    <button class="theme-btn" id="theme" type="button">Theme</button>
  </div>
</header>
<main class="wrap" id="app"></main>
<div id="tip" role="tooltip"></div>
<script>
"use strict";

// ---- small DOM helpers (text only, never innerHTML with data) ----------------------
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "style") n.setAttribute("style", v);
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return n;
}
const SVG = "http://www.w3.org/2000/svg";
function svg(tag, attrs, ...kids) {
  const n = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) n.setAttribute(k, v);
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined) n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return n;
}
const num = (v, d = 3) => (v === null || v === undefined || Number.isNaN(v)) ? "n/a" : Number(v).toFixed(d);
const pct = v => (v === null || v === undefined) ? "n/a" : (v * 100).toFixed(1) + "%";
const sum = (xs, f) => xs.reduce((a, x) => a + (f(x) || 0), 0);
const ratio = (a, b) => b ? a / b : null;

function taskId(name) {
  const parts = String(name).split("/").pop().split("_");
  if (parts.length >= 3 && (parts.at(-1) === "positive" || parts.at(-1) === "negative"))
    return [parts.slice(1, -1).join("_"), parts.at(-1)];
  return [String(name), ""];
}
function loc(v) {
  if (Array.isArray(v) && v.length) return v.length > 1 ? `${v[0]}:${v[1]}` : String(v[0]);
  if (v && typeof v === "object") return `${v.file || ""}:${v.start_line || ""}`;
  return String(v || "");
}
const RISK_LABEL = {
  sensitive_information_disclosure: "Sensitive Information Disclosure (LLM02)",
  excessive_agency: "Excessive Agency (LLM03)",
};
const CATEGORY_LABEL = {
  "LLM02.SID": "Sensitive Information Disclosure",
  "LLM02.SID.MEDIUM": "Sensitive Information Disclosure, Medium",
  "LLM02.SID.HIGH": "Sensitive Information Disclosure, High",
  "LLM03.EA.FUNCTIONALITY": "Excessive Agency, Tool Functionality",
  "LLM03.EA.PERMISSIONS": "Excessive Agency, Tool Permissions",
  "LLM03.EA.AUTONOMY": "Excessive Agency, Autonomy",
};
const SHORT_CATEGORY = {
  "LLM02.SID": "Disclosure",
  "LLM02.SID.MEDIUM": "Disclosure, Medium",
  "LLM02.SID.HIGH": "Disclosure, High",
  "LLM03.EA.FUNCTIONALITY": "Agency: Functionality",
  "LLM03.EA.PERMISSIONS": "Agency: Permissions",
  "LLM03.EA.AUTONOMY": "Agency: Autonomy",
};
const TRUTH_SET_LABEL = { both: "Both risks", "SID only": "Disclosure only", "EA only": "Agency only", neither: "Neither (negative)" };

// ---- tooltip -----------------------------------------------------------------------
const tip = document.getElementById("tip");
document.addEventListener("pointermove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.textContent = t.getAttribute("data-tip");
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});

// ---- theme -------------------------------------------------------------------------
(function () {
  let saved = null;
  try { saved = localStorage.getItem("sast-eval-theme"); } catch (e) {}
  if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
  document.getElementById("theme").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("sast-eval-theme", next); } catch (e) {}
  });
})();

// ---- data loading ------------------------------------------------------------------
async function loadData() {
  try {
    const embedded = JSON.parse(document.getElementById("report-data").textContent);
    if (embedded) return embedded;
  } catch (e) {}
  try {
    const r = await fetch("eval_report.json", { cache: "no-store" });
    if (r.ok) return await r.json();
  } catch (e) {}
  return null;
}
function showPicker(message) {
  const app = document.getElementById("app");
  app.replaceChildren(el("div", { class: "loader" },
    el("h1", {}, "SAST Scanner Evaluation"),
    el("p", { class: "sub" }, message || "Choose the eval_report.json written by tools/eval_report.py."),
    el("input", { type: "file", accept: ".json,application/json", onchange: e => {
      const f = e.target.files[0];
      if (!f) return;
      f.text().then(t => start(JSON.parse(t))).catch(err => showPicker("Could not read that file: " + err.message));
    } })));
}

// ---- state -------------------------------------------------------------------------
let DATA = null;
let visible = new Set();

function normalise(data) {
  // eval_report.json from tools/eval_report.py; an older list-of-tools payload is accepted too.
  if (Array.isArray(data)) data = { tools: data };
  data.tools.forEach((t, i) => { t._slot = Math.min(i, 3) + 1; t.trials = t.trials || []; });
  return data;
}
function start(data) {
  DATA = normalise(data);
  visible = new Set(DATA.tools.map(t => t.tool));
  render();
}
const shown = () => DATA.tools.filter(t => visible.has(t.tool));
const color = t => `var(--tool-${t._slot})`;
const swatch = t => el("span", { class: "swatch", style: `background:${color(t)}` });
const toolHead = t => el("span", { class: "toolhead" }, swatch(t), t.tool);

// ---- derived numbers ---------------------------------------------------------------
function positives(t) { return t.trials.filter(r => r.reward !== null && (r.gt || 0) > 0); }
function negatives(t) { return t.trials.filter(r => r.reward !== null && r.gt === 0); }
function pathStats(t) {
  const pos = positives(t);
  const gt = sum(pos, r => r.gt);
  const withMeta = pos.filter(r => r.near !== null && r.near !== undefined);
  const gtMeta = sum(withMeta, r => r.gt);
  const hits = t.hits || [];
  return {
    gt, tp: sum(pos, r => r.tp),
    findingRecall: ratio(sum(pos, r => r.tp), gt),
    nearRecall: ratio(sum(withMeta, r => r.near), gtMeta),
    nearCweRecall: ratio(sum(withMeta, r => r.near_cwe), gtMeta),
    withTrace: hits.filter(h => (h.scores || {}).path > 0).length,
    hits: hits.length,
  };
}
function emitted(t) { return (t.funnel || {}).results_emitted || 0; }

// ---- reusable pieces ---------------------------------------------------------------
function meter(value, t, tipText, invert) {
  const v = value === null || value === undefined ? null : Math.max(0, Math.min(1, value));
  return el("div", { class: "meter", "data-tip": tipText || null },
    el("div", { class: "bar" }, v === null ? null :
      el("div", { class: "fill", style: `width:${(v * 100).toFixed(1)}%;background:${t ? color(t) : (invert ? "var(--critical)" : "var(--good)")}` })),
    el("span", { class: "val" }, v === null ? "n/a" : num(value, 2)));
}
function status(kind, text, tipText) {
  const icon = { ok: "✓", bad: "✕", na: "–" }[kind];
  return el("span", { class: `status ${kind}`, "data-tip": tipText || null }, el("span", { class: "ic", "aria-hidden": "true" }, icon), text);
}
function table(head, rows, numCols) {
  const nc = new Set(numCols || []);
  return el("div", { class: "scroll" }, el("table", {},
    el("thead", {}, el("tr", {}, head.map((h, i) => el("th", { class: nc.has(i) ? "num" : null, scope: "col" }, h)))),
    el("tbody", {}, rows.map(r => el("tr", {}, r.map((c, i) => el("td", { class: nc.has(i) ? "num" : null }, c)))))));
}
function section(id, kicker, title, lede, ...body) {
  return el("section", { class: "block", id, "aria-labelledby": id + "-h" },
    kicker ? el("div", { class: "kicker" }, kicker) : null,
    el("h2", { id: id + "-h" }, title),
    lede ? el("p", { class: "lede" }, lede) : null,
    body);
}

// Horizontal bar chart, one bar per tool, on a fixed domain. Diverging when min < 0.
function barChart(items, { min = 0, max = 1, label, fmt = v => num(v, 3) }) {
  // Drawn at the width it is shown at, so the text stays 12px on a phone too.
  const W = Math.max(300, Math.min(720, (document.getElementById("app").clientWidth || 720) - 48));
  const rowH = 34, left = W < 480 ? 92 : 120, right = 56, top = 8, bottom = 26;
  const H = top + bottom + items.length * rowH;
  const x = v => left + (v - min) / (max - min) * (W - left - right);
  const ticks = min < 0 ? [min, min / 2, 0, max / 2, max] : [0, .25, .5, .75, 1].map(f => min + f * (max - min));
  const g = svg("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": label });
  ticks.forEach(tk => {
    g.append(svg("line", { x1: x(tk), x2: x(tk), y1: top, y2: H - bottom, class: tk === 0 && min < 0 ? "axisline" : "gridline", "stroke-width": 1 }));
    g.append(svg("text", { x: x(tk), y: H - 8, "text-anchor": "middle" }, fmt(tk).replace(/0+$/, "").replace(/\.$/, "") || "0"));
  });
  items.forEach((it, i) => {
    const y = top + i * rowH + 8, h = rowH - 16;
    const v = it.value;
    g.append(svg("text", { x: left - 10, y: y + h / 2 + 4, "text-anchor": "end", class: "lbl" }, it.name));
    if (v === null || v === undefined) {
      g.append(svg("text", { x: x(Math.max(0, min)) + 6, y: y + h / 2 + 4 }, "n/a"));
      return;
    }
    const x0 = x(Math.max(min, 0)), x1 = x(v);
    const bx = Math.min(x0, x1), bw = Math.max(Math.abs(x1 - x0), v === 0 ? 0 : 2);
    const bar = svg("rect", { x: bx, y, width: bw, height: h, rx: 4, fill: it.color, "data-tip": `${it.name}: ${fmt(v)}${it.tip ? " (" + it.tip + ")" : ""}` });
    g.append(bar);
    if (v === 0) g.append(svg("line", { x1: x0, x2: x0, y1: y - 2, y2: y + h + 2, stroke: it.color, "stroke-width": 2, "data-tip": `${it.name}: ${fmt(v)}` }));
    // invisible hit target bigger than the mark
    g.append(svg("rect", { x: left, y: y - 6, width: W - left - right, height: h + 12, fill: "transparent", "data-tip": `${it.name}: ${fmt(v)}${it.tip ? " (" + it.tip + ")" : ""}` }));
    const lx = v >= 0 ? Math.max(x1, x0) + 6 : Math.min(x1, x0) - 6;
    g.append(svg("text", { x: lx, y: y + h / 2 + 4, "text-anchor": v >= 0 ? "start" : "end", class: "lbl" }, fmt(v)));
  });
  return g;
}

// ---- sections ----------------------------------------------------------------------
function renderHeader() {
  const tools = DATA.tools;
  const first = tools[0] || { trials: [] };
  const fams = new Set(first.trials.map(r => taskId(r.task)[0]));
  const pos = positives(first), neg = negatives(first);
  const gt = sum(pos, r => r.gt);
  const sets = ((first.summary || {}).risk_types || {}).by_truth_set || {};
  const chips = el("div", { class: "chips", role: "group", "aria-label": "Scanners shown" },
    tools.map(t => el("button", {
      class: "chip", type: "button", "aria-pressed": visible.has(t.tool) ? "true" : "false",
      "data-tip": `${Object.keys(t.agent_versions || {}).join(", ")}${Object.keys(t.image_manifests || {}).length ? " | image " + Object.keys(t.image_manifests).join(", ") : ""}`,
      onclick: () => { if (visible.has(t.tool)) { if (visible.size > 1) visible.delete(t.tool); } else visible.add(t.tool); render(); },
    }, swatch(t), t.tool, el("span", { class: "meta" }, Object.keys(t.agent_versions || {})[0] || ""))));
  return el("div", { id: "overview" },
    el("div", { class: "kicker" }, "OWASP LLM02:2026 and LLM03:2026 static analysis benchmark"),
    el("h1", {}, "How well do SAST scanners find Sensitive Information Disclosure and Excessive Agency in GenAI code?"),
    el("p", { class: "sub" }, `Report generated ${DATA.generated ? DATA.generated.replace("T", " ").replace("Z", " UTC") : "(unknown time)"}. ` +
      "Each scanner saw only the repository and its security-context manifest, never the labels."),
    chips,
    el("p", { class: "small" }, "Click a scanner to hide or show it everywhere in the report."),
    el("div", { class: "tiles" },
      tile(fams.size, "repository families"),
      tile(pos.length, "positive tasks (vulnerable)"),
      tile(neg.length, "ambiguous negatives (fixed twin)"),
      tile(gt, "ground-truth findings"),
      tile(["both", "SID only", "EA only"].map(k => (sets[k] || {}).tasks || 0).join(" / "), "positives with both risks / disclosure only / agency only")),
    DATA.observations && DATA.observations.length ? el("div", { class: "callout", role: "note" },
      el("strong", {}, "Key observations"),
      el("ul", {}, DATA.observations.filter(o => shown().some(t => o.startsWith(t.tool + " ")) || !DATA.tools.some(t => o.startsWith(t.tool + " "))).map(o => el("li", {}, o)))) : null,
    renderScoreboard());
}
function tile(v, l) { return el("div", { class: "tile" }, el("div", { class: "v" }, v), el("div", { class: "l" }, l)); }

function renderScoreboard() {
  const ts = shown();
  const rows = [
    ["Ground-truth findings detected", t => { const p = pathStats(t); return `${p.tp} / ${p.gt}`; }, [1]],
    ["Risk detection, mean TPR over the two risks", t => num(mean(Object.values(RISK_LABEL).map((_, i) => riskRow(t, Object.keys(RISK_LABEL)[i]).TPR)))],
    ["Risk detection, mean FPR over the two risks", t => num(mean(Object.keys(RISK_LABEL).map(k => riskRow(t, k).FPR)))],
    ["Exact risk set (both / one / neither) correct", t => { const s = exactTotals(t); return `${s.exact} / ${s.tasks}`; }],
    ["Ambiguous negatives judged clean", t => { const z = (t.summary || {}).zero_finding_tasks_clean || [0, 0]; return `${z[0]} / ${z[1]}`; }],
    ["Path tracing, mean score on positives", t => num(meas(t).path)],
    ["Mitigation detection, mean score on positives", t => num(meas(t).controls)],
    ["Recommendation, mean score on positives", t => num(meas(t).recommendations)],
    ["OWASP Benchmark score (mean TPR minus mean FPR)", t => num(cat(t).score)],
    ["Results written by the scanner", t => String(emitted(t))],
  ];
  const chart = barChart(ts.map(t => ({ name: t.tool, value: cat(t).score, color: color(t), tip: `TPR ${num(cat(t).mean_TPR)}, FPR ${num(cat(t).mean_FPR)}` })),
    { min: -1, max: 1, label: "OWASP Benchmark score per scanner, from -1 to 1" });
  return el("section", { class: "block", "aria-labelledby": "score-h" },
    el("h2", { id: "score-h" }, "Scoreboard"),
    el("p", { class: "lede" }, "One row per measurement the client requirement asks every task to support. Positives and negatives are always scored apart, since a scanner that reports nothing passes every negative."),
    table(["Measure", ...ts.map(toolHead)], rows.map(([label, f]) => [label, ...ts.map(t => f(t))]), ts.map((_, i) => i + 1)),
    el("h3", {}, "OWASP Benchmark score per scanner"),
    el("p", { class: "small" }, "Mean true positive rate minus mean false positive rate over the taxonomy categories. 0 is what guessing or reporting nothing earns, 1 is perfect."),
    chart);
}
const mean = xs => { const v = xs.filter(x => x !== null && x !== undefined); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const cat = t => ((t.summary || {}).categories || {}).overall || {};
const meas = t => (t.summary || {}).measurements_positive_tasks || {};
const riskRow = (t, k, key = "risk_types") => (((t.summary || {})[key]) || {})[k] || {};
function exactTotals(t) {
  const sets = riskRow(t, "by_truth_set");
  return { exact: sum(Object.values(sets), v => v.exact), tasks: sum(Object.values(sets), v => v.tasks) };
}

function renderM1() {
  const ts = shown();
  const riskTables = Object.entries(RISK_LABEL).map(([k, label]) => el("div", {},
    el("h3", {}, label),
    table(["Scanner", "Recall (TPR)", "False alarm rate (FPR)", "TP", "FN", "FP", "TN", "Precision"],
      ts.map(t => { const r = riskRow(t, k); return [toolHead(t),
        meter(r.TPR, t, `${t.tool}: ${r.TP || 0} of ${(r.TP || 0) + (r.FN || 0)} tasks with this risk flagged`),
        meter(r.FPR, null, `${t.tool}: ${r.FP || 0} of ${(r.FP || 0) + (r.TN || 0)} tasks without this risk flagged`, true),
        r.TP, r.FN, r.FP, r.TN, num(r.precision)]; }), [3, 4, 5, 6, 7])));
  const setNames = [...new Set(ts.flatMap(t => Object.keys(riskRow(t, "by_truth_set"))))]
    .sort((a, b) => ["both", "SID only", "EA only", "neither"].indexOf(a) - ["both", "SID only", "EA only", "neither"].indexOf(b));
  const exact = table(["Labelled risk set", "Tasks", ...ts.map(toolHead)],
    setNames.map(s => { const tasks = (riskRow(ts[0], "by_truth_set")[s] || {}).tasks || 0;
      return [TRUTH_SET_LABEL[s] || s, tasks, ...ts.map(t => { const v = riskRow(t, "by_truth_set")[s];
        return v ? meter(v.exact_rate, t, `${t.tool}: predicted set equals the label on ${v.exact} of ${v.tasks}`) : "n/a"; })]; }), [1]);
  return section("m1", "Measurement 1", "Risk detection",
    "Does the scanner say whether the repository causes Sensitive Information Disclosure, Excessive Agency, both, or neither? A risk counts as detected on a task only when a reported result matched a ground-truth finding (or, on a negative, when a result fails it).",
    riskTables,
    el("h3", {}, "Exact risk set per task"),
    el("p", { class: "small" }, "Share of tasks where the set of risks the scanner reported is exactly the labelled set. On negatives the right answer is neither."),
    exact);
}

function renderM2() {
  const ts = shown();
  return section("m2", "Measurement 2", "Reachability and path tracing",
    "Does the scanner identify the weakness, the affected asset and the reachable path from the source or model decision to the sink or action? Scored on positive tasks against each ground-truth finding.",
    table(["Scanner", "Findings matched", "Finding recall", "Result near the finding", "Near, with an acceptable CWE", "Path score (mean)", "Detections with a trace"],
      ts.map(t => { const p = pathStats(t); return [toolHead(t), `${p.tp} / ${p.gt}`,
        meter(p.findingRecall, t, "Matched by location, rule and CWE, as the grader does"),
        meter(p.nearRecall, t, "Any security result of the tool within the line tolerance of the finding, before OWASP mapping"),
        meter(p.nearCweRecall, t, "As before, and the raw result carries one of the finding's acceptable CWEs"),
        meter(meas(t).path, t, "Share of the labelled path steps covered by the result's codeFlows, averaged over every finding (missed findings score 0)"),
        `${p.withTrace} / ${p.hits}`]; }), [1, 6]),
    el("p", { class: "note" }, "The two near columns look at the scanner's raw output, before anything is mapped to an OWASP rule. They show how close a tool came even when it reported the wrong rule or no rule. A detection with a trace is a matched result whose code flow earned path credit."));
}

function renderM3() {
  const ts = shown();
  return section("m3", "Measurement 3", "Mitigation detection",
    "Can the scanner tell vulnerable code from code with partial or complete controls, and judge the residual risk? On positives this is the control status and residual risk of each matched result. The ambiguous negatives, where a working control is the only difference, test the same skill from the other side.",
    table(["Scanner", "Control and residual-risk score (positives, mean)", "Ambiguous negatives judged clean", "Flagged next to the fixed code", "Flagged on a decoy"],
      ts.map(t => { const z = (t.summary || {}).zero_finding_tasks_clean || [0, 0]; const neg = ((t.summary || {}).reward_by_role || {}).negative || {};
        return [toolHead(t), meter(meas(t).controls, t, "controlStatus (75%) and residualRisk (25%) compared with the labels, missed findings score 0"),
          meter(ratio(z[0], z[1]), t, `${z[0]} of ${z[1]} negatives with no false positive`),
          String(neg.failed_near_fix || 0), String(neg.failed_trap || 0)]; }), [3, 4]),
    el("p", { class: "note" }, "A negative counts as clean only when the scanner reports nothing on the fixed code and nothing on its decoys. Results elsewhere in the repository are listed under scanner output but not held against it."));
}

function renderM4() {
  const ts = shown();
  return section("m4", "Measurement 4", "Mitigation recommendation",
    "Does the scanner recommend risk-specific controls where they are missing or ineffective, such as authorizing before retrieval, minimising context, sink-side enforcement, least-privilege tools and exact-action approval?",
    table(["Scanner", "Recommendation score (positives, mean)", "Matched detections"],
      ts.map(t => [toolHead(t), meter(meas(t).recommendations, t, "Recommendations that apply to the finding earn credit, inapplicable ones are penalised, missed findings score 0"), String((t.hits || []).length)]), [2]),
    el("p", { class: "note" }, "Plain SAST scanners report a rule and a location, not a remediation plan, so this measurement can only be earned through matched detections that carry recommendations."));
}

function renderNegatives() {
  const ts = shown();
  const fps = ts.flatMap(t => (t.false_positives || []).filter(f => f.kind !== "unmatched").map(f => [toolHead(t), taskId(f.task)[0],
    f.kind === "trap" ? "Decoy" : "Next to the fix", el("code", {}, f.rule || ""), el("code", {}, loc(f.location)), f.traps || ""]));
  const chart = barChart(ts.map(t => { const z = (t.summary || {}).zero_finding_tasks_clean || [0, 0]; return { name: t.tool, value: ratio(z[0], z[1]), color: color(t), tip: `${z[0]} of ${z[1]}` }; }),
    { min: 0, max: 1, label: "Share of ambiguous negatives judged clean per scanner" });
  return section("negatives", "Ambiguous negatives", "Hard negatives near the P/N boundary",
    "Each negative is the fixed twin of a positive: it differs only in the safety-relevant condition, for example the sensitive value no longer reaches the external sink, or a broad permission is narrowed by the deployed configuration. Some negatives also carry decoys that look risky but are safe.",
    el("h3", {}, "Negatives judged clean"), chart,
    el("h3", {}, "Every false alarm on a negative"),
    fps.length ? table(["Scanner", "Family", "Where", "Rule", "Location", "Decoy"], fps) : el("p", { class: "empty" }, "No scanner raised a false alarm on a negative."));
}

function renderFamilies() {
  const ts = shown();
  const fams = new Map();
  for (const t of ts) for (const r of t.trials) {
    const [id, role] = taskId(r.task);
    if (!fams.has(id)) fams.set(id, { id, truth: null, cats: new Set(), byTool: new Map() });
    const f = fams.get(id);
    if (role === "positive") {
      Object.entries(r.categories || {}).forEach(([c, v]) => { if (v.truth) f.cats.add(c); });
      f.risks = Object.entries(r.risks || {}).filter(([, v]) => v.truth).map(([k]) => k);
      f.gt = r.gt;
    }
    if (!f.byTool.has(t.tool)) f.byTool.set(t.tool, {});
    f.byTool.get(t.tool)[role || "task"] = r;
  }
  const cols = `minmax(150px,1.3fr) ${ts.map(() => "minmax(150px,1fr)").join(" ")}`;
  const head = el("div", { style: `display:grid;grid-template-columns:${cols};gap:10px;padding:0 4px 6px 4px;font-size:12px;font-weight:600;color:var(--ink-2)` },
    el("div", {}, "Family and labels"), ts.map(t => el("div", {}, toolHead(t))));
  const rows = [...fams.values()].sort((a, b) => a.id.localeCompare(b.id)).map(f => {
    const cells = ts.map(t => {
      const pr = f.byTool.get(t.tool) || {};
      const p = pr.positive, n = pr.negative;
      return el("div", {},
        p ? (p.reward === null ? status("na", p.status) : status(p.tp > 0 ? "ok" : "bad", `found ${p.tp || 0}/${p.gt || 0}`, `Positive: reward ${num(p.reward)}, ${p.fp || 0} unmatched results`)) : status("na", "not run"),
        el("br"),
        n ? (n.reward === null ? status("na", n.status) : status((n.fp || 0) === 0 ? "ok" : "bad", (n.fp || 0) === 0 ? "negative clean" : `negative: ${n.fp} alarm${n.fp > 1 ? "s" : ""}`)) : status("na", "not run"));
    });
    const details = ts.map(t => {
      const hits = (t.hits || []).filter(h => taskId(h.task)[0] === f.id);
      const fps = (t.false_positives || []).filter(x => taskId(x.task)[0] === f.id);
      const pr = (f.byTool.get(t.tool) || {});
      if (!hits.length && !fps.length) return el("p", {}, toolHead(t), el("span", { class: "small" }, `  no results on this family (${(pr.positive || {}).raw ?? "?"} raw results on the positive before mapping)`));
      return el("div", {}, el("p", {}, toolHead(t)),
        table(["Twin", "Outcome", "Rule", "Location", "Decoy"],
          [...hits.map(h => [taskId(h.task)[1], status("ok", "matched " + h.finding), el("code", {}, h.rule), el("code", {}, loc(h.location)), ""]),
           ...fps.map(x => [taskId(x.task)[1], status("bad", { unmatched: "unmatched", trap: "on a decoy", near_fix: "next to the fix" }[x.kind] || x.kind), el("code", {}, x.rule), el("code", {}, loc(x.location)), x.traps || ""])]));
    });
    return el("details", { class: "fam" },
      el("summary", { style: `grid-template-columns:${cols}` },
        el("div", {}, el("span", { class: "caret", "aria-hidden": "true" }, "▸"), " ", el("strong", { class: "mono" }, f.id),
          el("div", {}, [...f.cats].sort().map(c => el("span", { class: "tag", "data-tip": c }, SHORT_CATEGORY[c] || c)),
            f.gt !== undefined ? el("span", { class: "small" }, ` ${f.gt} finding${f.gt === 1 ? "" : "s"}`) : null)),
        cells),
      el("div", { class: "body" }, details));
  });
  return section("families", "Repository families", "Each family: the vulnerable task and its fixed twin",
    "One row per family. Open a row to see every result the scanners reported on it, matched or not.",
    el("div", { class: "scroll" }, el("div", { style: "min-width:" + (180 + ts.length * 160) + "px" }, head, rows)));
}

function renderTaxonomy() {
  const ts = shown();
  const cats = [...new Set(ts.flatMap(t => Object.keys(((t.summary || {}).categories || {}).per_category || {})))].sort();
  const rows = cats.flatMap(c => ts.map((t, i) => { const v = (((t.summary || {}).categories || {}).per_category || {})[c] || {};
    return [i === 0 ? el("strong", {}, CATEGORY_LABEL[c] || c) : "", toolHead(t),
      meter(v.TPR, t, `${v.TP || 0} of ${(v.TP || 0) + (v.FN || 0)} tasks in this category detected`),
      meter(v.FPR, null, `${v.FP || 0} of ${(v.FP || 0) + (v.TN || 0)} tasks outside it flagged`, true),
      num(v.youden), v.TP, v.FN, v.FP, v.TN]; }));
  return section("taxonomy", "Risk taxonomy", "Scores per taxonomy category (OWASP Benchmark style)",
    "Every graded task is a test case for each category it is labelled with. The score per category is the true positive rate minus the false positive rate (Youden), as the OWASP Benchmark scorecard computes it.",
    table(["Category", "Scanner", "TPR", "FPR", "Score", "TP", "FN", "FP", "TN"], rows, [4, 5, 6, 7, 8]),
    el("p", { class: "note" }, "Severity (Medium or High disclosure) is carried in the reported rule and checked as classification on matched findings."));
}

function renderOutput() {
  const ts = shown();
  const stages = [["results_raw", "Raw scanner results"], ["findings_security", "Security results"], ["findings_mapped", "Mapped to an OWASP LLM02 or LLM03 rule"], ["results_emitted", "Written to the SARIF that was graded"]];
  const funnel = table(["Stage", ...ts.map(toolHead)], stages.map(([k, l]) => [l, ...ts.map(t => String((t.funnel || {})[k] || 0))]), ts.map((_, i) => i + 1));
  const dropped = table(["Scanner", "Dropped CWEs (no LLM02 or LLM03 rule covers them)", "Reported, by OWASP rule"],
    ts.map(t => [toolHead(t),
      el("div", {}, Object.entries(t.unmapped_by_cwe || {}).slice(0, 10).map(([k, v]) => el("span", { class: "tag" }, `${k} ×${v}`))),
      el("div", {}, Object.entries(t.results_by_rule || {}).map(([k, v]) => el("span", { class: "tag" }, `${k} ×${v}`)))]));
  const ops = table(["Scanner", "Trials ok", "Not ok", "Mean setup s", "Mean scan s", "Agent", "Image manifest"],
    ts.map(t => { const bad = t.trials.filter(r => r.status !== "ok");
      return [toolHead(t), String(t.trials.length - bad.length), String(bad.length),
        num(mean(t.trials.map(r => r.setup_s)), 1), num(mean(t.trials.map(r => r.scan_s)), 1),
        Object.keys(t.agent_versions || {}).join(", "), el("code", {}, Object.keys(t.image_manifests || {}).join(", ") || "not recorded")]; }), [1, 2, 3, 4]);
  const errs = ts.flatMap(t => t.trials.filter(r => r.status !== "ok").map(r => [toolHead(t), r.task, r.status, r.error || ""]));
  const unmatched = ts.flatMap(t => (t.false_positives || []).filter(f => f.kind === "unmatched").map(f => [toolHead(t), taskId(f.task)[0], el("code", {}, f.rule), el("code", {}, loc(f.location)), f.traps || ""]));
  return section("output", "Scanner output", "What each scanner reported and where it went",
    "Scanner results are mapped to the OWASP rules by CWE. A result whose CWEs no LLM02 or LLM03 rule covers is dropped before grading; these counts show how much of each tool's output fell outside the two risks.",
    funnel, el("h3", {}, "CWEs and rules"), dropped,
    el("h3", {}, "Unmatched results on positives"),
    unmatched.length ? table(["Scanner", "Family", "Rule", "Location", "On a decoy"], unmatched) : el("p", { class: "empty" }, "None."),
    el("h3", {}, "Runs"), ops,
    errs.length ? [el("h3", {}, "Trials that did not finish cleanly"), table(["Scanner", "Task", "Status", "Error"], errs)] : null);
}

function renderMethod() {
  return section("method", "Method", "How the numbers are computed",
    null,
    el("ul", {},
      el("li", {}, "Each task is a small runnable repository. Scanners receive only the repository source, configuration and safe fixtures plus the security-context manifest; labels, expected findings and reproduction tests stay evaluator-only."),
      el("li", {}, "A finding is one risk type and one independently remediable weakness on one path. A reported result matches a finding when it lands in the labelled file and line range (within the task's line tolerance) and carries one of the finding's acceptable CWEs. Each result matches at most one finding, chosen by an optimal assignment. Classification then credits the reported OWASP rule (half credit for a partial-credit rule) and the CWE."),
      el("li", {}, "Positives are scored on detection, classification, path, controls and recommendations. Negatives fail only when a result lands next to the fixed code or on a decoy."),
      el("li", {}, "Task-level risk detection counts a risk as predicted only from results that matched a finding (or that fail the negative). Category scores follow the OWASP Benchmark scorecard: TPR minus FPR per category, then the mean."),
      el("li", {}, DATA.harbor_mean_warning || "Harbor's job-level mean reward averages positives and negatives together and is not a score.")),
    DATA.tasks_dir ? el("p", { class: "small" }, "Ground truth read from ", el("code", {}, DATA.tasks_dir)) : null,
    el("p", { class: "small" }, "Jobs: ", DATA.tools.map(t => el("div", {}, el("code", {}, t.job || "")))));
}

function render() {
  const app = document.getElementById("app");
  const y = window.scrollY;
  app.replaceChildren(renderHeader(), renderM1(), renderM2(), renderM3(), renderM4(), renderNegatives(), renderFamilies(), renderTaxonomy(), renderOutput(), renderMethod(),
    el("footer", {}, "Generated by tools/eval_report.py from Harbor jobs. Schema ", DATA.schema || "sast-eval-report/1", "."));
  window.scrollTo(0, y);
}

let resizeTimer = null, lastWidth = innerWidth;
addEventListener("resize", () => {
  if (!DATA || Math.abs(innerWidth - lastWidth) < 40) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { lastWidth = innerWidth; render(); }, 200);
});

loadData().then(d => d ? start(d) : showPicker()).catch(e => showPicker("Could not load the report: " + e.message));
</script>
</body>
</html>
