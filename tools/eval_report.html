<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAST Scanner Evaluation</title>
<!--
  View of eval_report.json written by tools/eval_report.py.

  tools/eval_report.py --out <dir> writes a copy of this file as
  <dir>/eval_report.html with the report embedded in the script element
  below, so it opens straight from disk. This template on its own looks for
  the data in three places, in order: the embedded element, eval_report.json
  next to the page (works when the folder is served over HTTP), then a file
  picker. Self-contained: no external scripts, fonts or styles.

  Most figures are computed in tools/eval_report.py and tools/report.py and
  read from the payload (scoreboard rows, measurement rows, dataset, method
  text), so this page and eval_report.md always show the same metric set.

  Layout follows the client requirement (Sensitive Data and Excessive Agency
  Detector, eval data requirement v3): the four measurements each task must
  support (1 risk detection, 2 reachability and path tracing, 3 mitigation
  detection, 4 mitigation recommendation), then the ambiguous negatives, the
  repository families (positive and negative twin), the taxonomy categories
  and the scanner output.
-->
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f3f2ee;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6d68;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --bar: #2a78d6;
  --bar-bad: #eb6834;
  --tool-1: #2a78d6;
  --tool-2: #eb6834;
  --tool-3: #1baf7a;
  --tool-4: #4a3aa7;
  --tool-5: #c23f8e;
  --tool-6: #9a7400;
  --tool-7: #0f8aa6;
  --tool-8: #7a4f2a;
  --good: #0ca30c;
  --good-ink: #006300;
  --warning: #fab219;
  --critical: #d03b3b;
  --critical-ink: #b42323;
  --track: #ecebe6;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #222220;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #9a988f;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --bar: #3987e5;
    --bar-bad: #d95926;
    --tool-1: #3987e5;
    --tool-2: #d95926;
    --tool-3: #199e70;
    --tool-4: #9085e9;
    --tool-5: #e06aaf;
    --tool-6: #d1a52a;
    --tool-7: #3bb5d1;
    --tool-8: #b88a62;
    --good-ink: #0ca30c;
    --critical-ink: #e66767;
    --track: #2a2a28;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #222220;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #9a988f;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --bar: #3987e5;
  --bar-bad: #d95926;
  --tool-1: #3987e5;
  --tool-2: #d95926;
  --tool-3: #199e70;
  --tool-4: #9085e9;
  --tool-5: #e06aaf;
  --tool-6: #d1a52a;
  --tool-7: #3bb5d1;
  --tool-8: #b88a62;
  --good-ink: #0ca30c;
  --critical-ink: #e66767;
  --track: #2a2a28;
  --shadow: none;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 64px; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
a { color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
header.top {
  position: sticky; top: 0; z-index: 5; background: var(--page);
  border-bottom: 1px solid var(--border);
}
header.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 52px; flex-wrap: wrap; }
header.top .brand { font-weight: 650; white-space: nowrap; }
nav.sections { display: flex; gap: 4px; overflow-x: auto; flex: 1; scrollbar-width: none; }
nav.sections a {
  text-decoration: none; color: var(--ink-2); font-size: 13px; padding: 6px 10px;
  border-radius: 6px; white-space: nowrap;
}
nav.sections a:hover { background: var(--surface-2); color: var(--ink); }
.theme-btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer;
}
main { padding: 24px 0 64px; }
h1 { font-size: 26px; line-height: 1.25; margin: 8px 0 6px; font-weight: 650; }
h2 { font-size: 20px; margin: 0 0 4px; font-weight: 650; }
h3 { font-size: 15px; margin: 18px 0 8px; font-weight: 650; }
.sub { color: var(--ink-2); margin: 0 0 4px; }
.small { font-size: 13px; color: var(--muted); }
section.block {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 20px; margin: 18px 0; box-shadow: var(--shadow);
}
.kicker { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--ink-2); max-width: 820px; margin: 4px 0 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border);
  background: var(--surface); border-radius: 999px; padding: 4px 12px 4px 8px; font-size: 13px;
  cursor: pointer; user-select: none; color: var(--ink);
}
.chip[aria-pressed="false"] { opacity: .45; }
.chip .meta { color: var(--muted); }
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 14px 0 4px; }
.tile { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; background: var(--surface); }
.tile .v { font-size: 26px; font-weight: 650; line-height: 1.2; }
.tile .l { font-size: 13px; color: var(--ink-2); }
.callout {
  border-left: 3px solid var(--warning); background: var(--surface-2); border-radius: 0 8px 8px 0;
  padding: 10px 14px; margin: 14px 0;
}
.callout ul { margin: 6px 0 0; padding-left: 18px; }
.callout li { margin: 3px 0; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
.toolhead { display: inline-flex; align-items: center; gap: 4px 6px; flex-wrap: wrap; }
.toolhead .badge { margin-left: 0; }
.meter { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.meter .bar { flex: 1; height: 8px; background: var(--track); border-radius: 4px; position: relative; min-width: 70px; }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.meter .val { font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; font-size: 13px; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; white-space: nowrap; }
.status .ic { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
.status.ok .ic { background: var(--good); }
.status.ok { color: var(--good-ink); }
.status.bad .ic { background: var(--critical); }
.status.bad { color: var(--critical-ink); }
.status.mixed .ic { background: var(--axis); color: var(--ink); }
.status.mixed { color: var(--ink-2); }
.fam .status { white-space: normal; }
.status.na { color: var(--muted); }
.status.na .ic { background: var(--axis); color: var(--ink); }
.note { font-size: 13px; color: var(--ink-2); margin: 10px 0 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.chart { width: 100%; max-width: 720px; height: auto; display: block; }
.chart text { fill: var(--ink-2); font-size: 12px; font-family: inherit; }
.chart .lbl { fill: var(--ink); }
.chart .gridline { stroke: var(--grid); }
.chart .axisline { stroke: var(--axis); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink-2); margin: 6px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
details.fam { border-bottom: 1px solid var(--grid); }
details.fam > summary { cursor: pointer; list-style: none; padding: 10px 4px; display: grid; gap: 10px; align-items: center; }
details.fam > summary::-webkit-details-marker { display: none; }
details.fam > summary:hover { background: var(--surface-2); }
details.fam .body { padding: 4px 4px 14px 24px; }
.caret { display: inline-block; transition: transform .15s; color: var(--muted); }
details[open] > summary .caret { transform: rotate(90deg); }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); margin: 1px 4px 1px 0; white-space: nowrap; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; overflow-wrap: anywhere; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap;
  background: var(--surface-2); color: var(--critical-ink); border: 1px solid var(--critical); margin-left: 6px; line-height: 1.5; }
.ns { color: var(--muted); font-style: italic; font-size: 13px; white-space: normal; }
.callout.warn { border-left-color: var(--critical); }
.swatch.striped { background-image: repeating-linear-gradient(45deg, transparent 0 2px, rgba(255,255,255,.75) 2px 4px); }
.empty { color: var(--muted); font-style: italic; }
#tip {
  position: fixed; pointer-events: none; z-index: 20; background: var(--ink); color: var(--page);
  font-size: 12px; padding: 6px 8px; border-radius: 6px; max-width: 320px; display: none; line-height: 1.4;
}
.loader { max-width: 560px; margin: 80px auto; text-align: center; }
.loader input { margin-top: 12px; }
footer { color: var(--muted); font-size: 13px; padding: 8px 0 40px; }
/* Plain-English summary at the top, then the reviewer views folded away below it. */
.sumtable th:first-child, .sumtable td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); }
.sumtable td:first-child { min-width: 150px; max-width: 220px; color: var(--ink-2); }
.sumtable td { min-width: 96px; }
.tiles.sumtiles { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.plain-list { margin: 6px 0 0; padding-left: 18px; }
.plain-list li { margin: 6px 0; max-width: 860px; }
.plain-list .swatch { margin-right: 6px; vertical-align: baseline; }
dl.gloss { margin: 6px 0 0; display: grid; grid-template-columns: minmax(120px, 200px) 1fr; gap: 8px 16px; }
dl.gloss dt { font-weight: 600; }
dl.gloss dd { margin: 0; color: var(--ink-2); max-width: 760px; }
/* Measurements at a glance: one bar hue (--bar, checked with the data-viz palette validator in both
   modes), the tool named in the row label, and a missing value written in its row, never a zero bar. */
.mgroup { border-top: 1px solid var(--grid); margin-top: 18px; }
.mgroup:first-of-type { border-top: 0; margin-top: 0; }
.mgroup > .kicker { margin-top: 14px; }
.mchart-title { font-size: 15px; font-weight: 600; margin: 2px 0 2px; }
.mcap { font-size: 13px; color: var(--ink-2); margin: 2px 0 6px; max-width: 760px; }
.mchart { display: block; width: 100%; max-width: 760px; height: auto; margin: 4px 0 10px; }
.mchart text { font-family: inherit; font-size: 12px; fill: var(--ink); }
.mchart .facet { fill: var(--ink-2); font-weight: 600; }
.mchart .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.mchart .state { fill: var(--muted); font-style: italic; stroke: var(--surface); stroke-width: 3px; paint-order: stroke; }
.mchart .grid { stroke: var(--grid); }
.mchart .axis { stroke: var(--axis); }
.mchart .mbar { fill: var(--bar); }
/* The one chart where a longer bar is worse (fixed apps wrongly flagged). */
.mchart.lower-better .mbar { fill: var(--bar-bad); }
.mtag { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--bar-bad); border: 1px solid var(--bar-bad); vertical-align: middle; }
.mchart .hit { fill: transparent; }
.mchart .mrow { outline: none; }
.mchart .mrow:hover .hit, .mchart .mrow:focus .hit { fill: var(--surface-2); }
.mchart .mrow:focus-visible .hit { stroke: var(--ink-2); stroke-width: 1px; }
.mchart .mrow:hover .mbar, .mchart .mrow:focus .mbar { opacity: .85; }
.mchart .mrow:hover .state, .mchart .mrow:focus .state { stroke: var(--surface-2); }
section.reviewers { margin: 32px 0 0; padding-top: 20px; border-top: 1px solid var(--axis); }
details.reviewers-body > summary {
  cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 8px; margin: 4px 0 8px;
  border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 6px 14px;
  font-weight: 600; color: var(--ink);
}
details.reviewers-body > summary::-webkit-details-marker { display: none; }
details.reviewers-body > summary:hover { background: var(--surface-2); }
@media (max-width: 640px) {
  dl.gloss { grid-template-columns: 1fr; gap: 2px; }
  dl.gloss dd { margin-bottom: 8px; }
}
@media (max-width: 640px) {
  h1 { font-size: 21px; }
  section.block { padding: 14px; }
  header.top .brand { display: none; }
}
@media print {
  header.top { position: static; }
  details.fam { break-inside: avoid; }
}
</style>
</head>
<body>
<script id="report-data" type="application/json">null</script>
<header class="top">
  <div class="wrap">
    <span class="brand">SAST Scanner Evaluation</span>
    <nav class="sections" aria-label="Sections">
      <a href="#summary">Summary</a>
      <a href="#overview">Overview</a>
      <a href="#m1">1 Risk detection</a>
      <a href="#m2">2 Path tracing</a>
      <a href="#m3">3 Mitigation detection</a>
      <a href="#m4">4 Recommendation</a>
      <a href="#negatives">Ambiguous negatives</a>
      <a href="#families">Families</a>
      <a href="#taxonomy">Taxonomy</a>
      <a href="#output">Scanner output</a>
      <a href="#method">Method</a>
    </nav>
    <button class="theme-btn" id="theme" type="button">Theme</button>
  </div>
</header>
<main class="wrap" id="app"></main>
<div id="tip" role="tooltip"></div>
<script>
"use strict";

// ---- small DOM helpers (text only, never innerHTML with data) ----------------------
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "style") n.setAttribute("style", v);
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return n;
}
const SVG = "http://www.w3.org/2000/svg";
function svg(tag, attrs, ...kids) {
  const n = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) n.setAttribute(k, v);
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined) n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return n;
}
const num = (v, d = 3) => (v === null || v === undefined || Number.isNaN(v)) ? "n/a" : Number(v).toFixed(d);
const sum = (xs, f) => xs.reduce((a, x) => a + (f(x) || 0), 0);
const ratio = (a, b) => b ? a / b : null;
const mean = xs => { const v = xs.filter(x => x !== null && x !== undefined); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

// Code text with break opportunities after separators, so long rule ids and paths
// wrap at a dot or slash instead of in the middle of a word.
function code(text) {
  const parts = String(text ?? "").split(/(?<=[./_:-])/);
  const n = el("code", {});
  parts.forEach((p, i) => { n.append(document.createTextNode(p)); if (i < parts.length - 1) n.append(el("wbr")); });
  return n;
}
function loc(v) {
  if (Array.isArray(v) && v.length) return v.length > 1 ? `${v[0]}:${v[1]}` : String(v[0]);
  if (v && typeof v === "object") return `${v.file || ""}:${v.start_line || ""}`;
  return String(v || "");
}
function parseTaskName(name) {
  const parts = String(name).split("/").pop().split("_");
  if (parts.length >= 3 && parts[0] === "task" && (parts.at(-1) === "positive" || parts.at(-1) === "negative"))
    return [parts.slice(1, -1).join("_"), parts.at(-1)];
  return [String(name), ""];
}
const RISK_LABEL = {
  sensitive_information_disclosure: "Sensitive Information Disclosure (LLM02)",
  excessive_agency: "Excessive Agency (LLM03)",
};
const CATEGORY_LABEL = {
  "LLM02.SID": "Sensitive Information Disclosure (Medium and High)",
  "LLM02.SID.MEDIUM": "Sensitive Information Disclosure, Medium",
  "LLM02.SID.HIGH": "Sensitive Information Disclosure, High",
  "LLM03.EA.FUNCTIONALITY": "Excessive Agency, Tool Functionality",
  "LLM03.EA.PERMISSIONS": "Excessive Agency, Tool Permissions",
  "LLM03.EA.AUTONOMY": "Excessive Agency, Autonomy",
};
const SHORT_CATEGORY = {
  "LLM02.SID": "Disclosure",
  "LLM02.SID.MEDIUM": "Disclosure, Medium",
  "LLM02.SID.HIGH": "Disclosure, High",
  "LLM03.EA.FUNCTIONALITY": "Agency: Functionality",
  "LLM03.EA.PERMISSIONS": "Agency: Permissions",
  "LLM03.EA.AUTONOMY": "Agency: Autonomy",
};
const TRUTH_SET_ORDER = ["both", "SID only", "EA only", "neither"];
const TRUTH_SET_LABEL = { both: "Both risks", "SID only": "Disclosure only", "EA only": "Agency only", neither: "Neither (negatives)" };

// ---- tooltip -----------------------------------------------------------------------
const tip = document.getElementById("tip");
document.addEventListener("pointermove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.textContent = t.getAttribute("data-tip");
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = Math.max(4, x) + "px"; tip.style.top = Math.max(4, y) + "px";
});

// Keyboard focus on a chart row shows the same tooltip, under the row.
document.addEventListener("focusin", e => {
  const t = e.target.closest && e.target.closest(".mrow[data-tip]");
  if (!t) return;
  tip.textContent = t.getAttribute("data-tip");
  tip.style.display = "block";
  const r = t.getBoundingClientRect();
  tip.style.left = Math.max(4, Math.min(r.left + 8, innerWidth - tip.offsetWidth - 8)) + "px";
  tip.style.top = Math.min(r.bottom + 6, innerHeight - tip.offsetHeight - 8) + "px";
});
document.addEventListener("focusout", e => { if (e.target.closest && e.target.closest(".mrow")) tip.style.display = "none"; });

// ---- theme -------------------------------------------------------------------------
(function () {
  let saved = null;
  try { saved = localStorage.getItem("sast-eval-theme"); } catch (e) {}
  if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
  document.getElementById("theme").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("sast-eval-theme", next); } catch (e) {}
  });
})();

// ---- data loading ------------------------------------------------------------------
async function loadData() {
  try {
    const embedded = JSON.parse(document.getElementById("report-data").textContent);
    if (embedded) return embedded;
  } catch (e) {}
  try {
    const r = await fetch("eval_report.json", { cache: "no-store" });
    if (r.ok) return await r.json();
  } catch (e) {}
  return null;
}
function showPicker(message) {
  const app = document.getElementById("app");
  app.replaceChildren(el("div", { class: "loader" },
    el("h1", {}, "SAST Scanner Evaluation"),
    el("p", { class: "sub" }, message || "Choose the eval_report.json written by tools/eval_report.py."),
    el("input", { type: "file", accept: ".json,application/json", onchange: e => {
      const f = e.target.files[0];
      if (!f) return;
      f.text().then(t => start(JSON.parse(t))).catch(err => showPicker("Could not read that file: " + err.message));
    } })));
}

// ---- state -------------------------------------------------------------------------
let DATA = null;
let visible = new Set();
const NS = () => DATA.not_supported || "not supported by this tool";
const BADGE = () => DATA.no_results_badge || "no results, scores not meaningful";
const NR = () => DATA.no_results_measure || "n/a (no results)";

function normalise(data) {
  // eval_report.json from tools/eval_report.py; an older list-of-tools payload is accepted too.
  if (Array.isArray(data)) data = { tools: data };
  const seen = new Set();
  data.tools.forEach((t, i) => {

// Horizontal bar chart, one bar per tool, on a fixed domain. Diverging when min < 0.
function barChart(items, { min = 0, max = 1, label, fmt = v => num(v, 3) }) {
  // Drawn at the width it is shown at, so the text stays 12px on a phone too.
  const W = Math.max(300, Math.min(720, (document.getElementById("app").clientWidth || 720) - 48));
  const rowH = 34, left = W < 480 ? 92 : 120, right = 56, top = 8, bottom = 26;
  const H = top + bottom + items.length * rowH;
  const x = v => left + (v - min) / (max - min) * (W - left - right);
  const ticks = min < 0 ? [min, min / 2, 0, max / 2, max] : [0, .25, .5, .75, 1].map(f => min + f * (max - min));
  const g = svg("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": label });
  ticks.forEach(tk => {
    g.append(svg("line", { x1: x(tk), x2: x(tk), y1: top, y2: H - bottom, class: tk === 0 && min < 0 ? "axisline" : "gridline", "stroke-width": 1 }));
    g.append(svg("text", { x: x(tk), y: H - 8, "text-anchor": "middle" }, fmt(tk).replace(/0+$/, "").replace(/\.$/, "") || "0"));
  });
  items.forEach((it, i) => {
    const y = top + i * rowH + 8, h = rowH - 16;
    const v = it.value;
    const name = it.name.length > 14 && W < 480 ? it.name.slice(0, 13) + "…" : it.name;
    g.append(svg("text", { x: left - 10, y: y + h / 2 + 4, "text-anchor": "end", class: "lbl" }, name));
    const tipText = `${it.name}: ${v === null || v === undefined ? "n/a" : fmt(v)}${it.tip ? " (" + it.tip + ")" : ""}`;
    if (v === null || v === undefined) {
      g.append(svg("text", { x: x(Math.max(0, min)) + 6, y: y + h / 2 + 4 }, "n/a"));
      return;
    }
    const x0 = x(Math.max(min, 0)), x1 = x(v);
    const bx = Math.min(x0, x1), bw = Math.max(Math.abs(x1 - x0), v === 0 ? 0 : 2);
    g.append(svg("rect", { x: bx, y, width: bw, height: h, rx: 4, fill: it.color, "stroke-dasharray": it.dashed ? "3 2" : null, stroke: it.dashed ? "var(--ink)" : null, "data-tip": tipText }));
    if (v === 0) g.append(svg("line", { x1: x0, x2: x0, y1: y - 2, y2: y + h + 2, stroke: it.color, "stroke-width": 2, "data-tip": tipText }));
    // invisible hit target bigger than the mark
    g.append(svg("rect", { x: left, y: y - 6, width: W - left - right, height: h + 12, fill: "transparent", "data-tip": tipText }));
    const lx = v >= 0 ? Math.max(x1, x0) + 6 : Math.min(x1, x0) - 6;
    g.append(svg("text", { x: lx, y: y + h / 2 + 4, "text-anchor": v >= 0 ? "start" : "end", class: "lbl" }, fmt(v) + (it.flag ? " *" : "")));
  });
  return g;
}
const chartItem = (t, value, tipText) => ({ name: t.key, value, color: color(t), dashed: striped(t), flag: t.no_results,

const chartFootnote = ts => ts.some(t => t.no_results)

function datasetOf() {
  if (DATA.dataset) return DATA.dataset;
  // Older payloads: the union of every tool's tasks.
  const tasks = new Map();
  for (const t of DATA.tools) for (const r of t.trials) if (!tasks.has(r.task)) tasks.set(r.task, r);
  const all = [...tasks.values()];
  const pos = all.filter(r => r.role === "positive");
  return { families: new Set(all.map(r => r.family)).size, positives: pos.length,
    negatives: all.filter(r => r.role === "negative").length, gt_findings: sum(pos, r => r.gt), positives_by_risk_set: {} };
}

// One outcome per task, not per role: a family can hold two positives, and a task run more than
// once (harbor -k N) is summed up over its runs. eval_report.py computes these. Older payloads
// without task_outcomes get one line per trial instead, so nothing is dropped.
function outcomesOf(t) {
  if (Array.isArray(t.task_outcomes)) return t.task_outcomes;
  return t.trials.map(r => {
    const role = r.role || "unknown";
    let kind = "na", text = `not scored (${r.status})`;
    if (isScored(r) && role === "positive") { kind = r.tp > 0 ? "ok" : "bad"; text = `${r.tp || 0}/${r.gt ?? "?"} found` + (r.fp ? `, ${r.fp} FP` : ""); }
    else if (isScored(r) && role === "negative") { kind = (r.fp || 0) === 0 ? "ok" : "bad"; text = (r.fp || 0) === 0 ? "clean" : `FAIL (${r.fp} FP)`; }
    else if (isScored(r)) text = `role unknown (${r.task})`;
    return { task: r.task, family: r.family, role, runs: 1, scored: isScored(r) ? 1 : 0, text, kind, gt: r.gt };
  });
}
const runLabel = x => x.run ? `${x.task} (run ${x.run})` : x.task;
const ROLE_RANK = { positive: 0, negative: 1 };
function renderFamilies() {
  const ts = shown();
  const fams = new Map();
  const famOf = id => { if (!fams.has(id)) fams.set(id, { id, name: null, cats: new Set(), tasks: new Map(), byTool: new Map() }); return fams.get(id); };
  for (const t of ts) {
    for (const r of t.trials) {
      const f = famOf(r.family);
      if (r.family_name && r.family_name !== r.family) f.name = r.family_name;
      if (!f.tasks.has(r.task)) f.tasks.set(r.task, { role: r.role || "unknown", gt: null, raw: new Map() });
      const task = f.tasks.get(r.task);
      if (task.role === "unknown" && r.role) task.role = r.role;
      if (r.role === "positive") {
        Object.entries(r.categories || {}).forEach(([c, v]) => { if (v.truth) f.cats.add(c); });
        if (r.gt !== null && r.gt !== undefined && (task.gt === null || isScored(r))) task.gt = r.gt;
      }
      if (r.raw !== null && r.raw !== undefined) task.raw.set(t.key, (task.raw.get(t.key) || 0) + r.raw);
    }
    for (const o of outcomesOf(t)) {
      const f = famOf(o.family);
      if (!f.tasks.has(o.task)) f.tasks.set(o.task, { role: o.role || "unknown", gt: o.gt ?? null, raw: new Map() });
      if (!f.byTool.has(t.key)) f.byTool.set(t.key, new Map());
      f.byTool.get(t.key).set(o.task, o);

  }

  const head = el("div", { style: `display:grid;grid-template-columns:${cols};gap:10px;padding:0 4px 6px 4px;font-size:12px;font-weight:600;color:var(--ink-2)` },
    el("div", {}, "Family and labels"), ts.map(t => el("div", {}, toolHead(t))));
  const rows = [...fams.values()].sort((a, b) => String(a.id).localeCompare(String(b.id))).map(f => {
    const order = [...f.tasks.entries()].sort(([a, x], [b, y]) => ((ROLE_RANK[x.role] ?? 2) - (ROLE_RANK[y.role] ?? 2)) || a.localeCompare(b));
    const roleCount = new Map();
    order.forEach(([, x]) => roleCount.set(x.role, (roleCount.get(x.role) || 0) + 1));
    // The task id is shown only when the family has two tasks of the same role.
    const lineName = (task, role) => roleCount.get(role) > 1 ? `${role} ${task}` : role;
    const gtSum = order.filter(([, x]) => x.role === "positive" && x.gt !== null && x.gt !== undefined).reduce((a, [, x]) => a + x.gt, 0);
    const hasGt = order.some(([, x]) => x.role === "positive" && x.gt !== null && x.gt !== undefined);
    const cells = ts.map(t => {
      const mine = f.byTool.get(t.key) || new Map();

        const o = mine.get(task);

        table(["Task", "Outcome", "Rule", "Location", "Decoy"],
          [...hits.map(h => [who(h), status("ok", "matched " + h.finding), code(h.rule), code(loc(h.location)), ""]),
           ...fps.map(x => [who(x), status("bad", { unmatched: "unmatched", trap: "on a decoy", near_fix: "next to the fix", in_scope: "anywhere in scope" }[x.kind] || x.kind), code(x.rule), code(loc(x.location)), x.traps || ""]),

        el("div", {}, el("span", { class: "caret", "aria-hidden": "true" }, "▸"), " ", el("strong", { class: "mono" }, f.id), f.name ? el("span", { class: "small mono" }, ` (${f.name})`) : null,
          el("div", {}, [...f.cats].sort().map(c => el("span", { class: "tag", "data-tip": c }, SHORT_CATEGORY[c] || c)),

    "One row per family, with one line per task (a family can hold more than one positive). A task run more than once shows how many runs gave each result. Open a row to see every result the scanners reported on it: matched, false positives, and results outside the scored scope.",
    el("div", { class: "scroll" }, el("div", { style: "min-width:" + (180 + ts.length * 160) + "px" }, head, rows)));
}

function renderTaxonomy() {
  const ts = shown();
  const cats = [...new Set(ts.flatMap(t => Object.keys((S(t).categories || {}).per_category || {})))].sort();
  const rows = cats.flatMap(c => ts.map((t, i) => { const v = ((S(t).categories || {}).per_category || {})[c] || {};

    return [i === 0 ? el("strong", {}, CATEGORY_LABEL[c] || c) : "", toolHead(t),
      meter(v.TPR, t, `${v.TP || 0} of ${P} positives labelled with this category detected`),
      meter(v.FPR, null, `${v.FP || 0} of ${N} negatives that contrast this category flagged`, true),
      num(v.youden), `${P} / ${N}`, `${v.TP || 0} / ${P}`, `${v.FP || 0} / ${N}`,
      (cat(t).cannot_emit || []).includes(c) ? el("span", { class: "ns", "data-tip": "Its ruleIds come from the CWE map, and no CWE maps to this category" }, "cannot emit, left out of its mean") : ""]; }));
  const means = ts.map(t => [toolHead(t), macro(t, "mean_TPR"), macro(t, "mean_FPR"), macro(t, "score"),

    "Every scored task is a test case for each category it is labelled with: a positive for the categories of its findings, a negative for the categories it contrasts. The score per category is the true positive rate minus the false positive rate (Youden), as in the OWASP Benchmark scorecard, but with this benchmark's matching rules and test cases.",

    el("p", { class: "note" }, "On a negative, a category counts as flagged when a failing result has the same OWASP prefix (LLM02 or LLM03), so an Excessive Agency result of any subtype flags an Excessive Agency negative. The means are over the categories that have both positives and negatives and that the scanner can emit (Semgrep, CodeQL, SonarQube and a stock Claude review take their rule from the CWE map, which never gives LLM03.EA.AUTONOMY). A mean reads \"" + TOO_FEW + "\" when any category in it has fewer than 5 positives or 5 negatives."),

}

  const ts = shown();

  const dropped = table(["Scanner", "Dropped CWEs (no LLM02 or LLM03 rule covers them)", "Reported, by OWASP rule"],

      el("div", {}, Object.entries(t.results_by_rule || {}).map(([k, v]) => el("span", { class: "tag" }, `${k} ×${v}`)))]));
  const ops = table(["Scanner", "Trials scored", "Not scored", "Mean setup s", "Mean scan s", "Agent", "Image manifest"],

    "Scanner results are mapped to the OWASP rules by CWE. A result whose CWEs no LLM02 or LLM03 rule covers is dropped before grading, and results of one family on the same file and line are merged into one. These counts show how much of each scanner's output fell outside the two risks.",

// ---- plain-English summary -----------------------------------------------------------

// ---- measurement charts ---------------------------------------------------------------
// Drawn from DATA.summary.charts, the specs eval_report.py also writes as charts/*.svg. One bar per
// tool on a 0 to 100% axis in one hue: the row label says which tool it is. A value that cannot be
// drawn is written in the tool's row, never shown as a zero bar.
let measureCtx = null;
function textW(text, size = 12) {
  measureCtx = measureCtx || document.createElement("canvas").getContext("2d");
  measureCtx.font = `${size}px system-ui, -apple-system, "Segoe UI", sans-serif`;
  return measureCtx.measureText(String(text)).width;
}
function barPath(x0, y, w, h) {
  const r = Math.min(4, w, h / 2);

}
function measureChart(c, W) {
  const rows = c.facets.flatMap(f => f.rows);
  const nameW = Math.max(0, ...rows.map(r => textW(r.tool)));
  const scored = rows.filter(r => r.value !== null && r.value !== undefined);
  const right = scored.length ? Math.max(...scored.map(r => textW(r.text))) + 12 : 8;
  const stateW = Math.max(0, ...rows.filter(r => r.value === null || r.value === undefined).map(r => textW(r.text)));
  // The tool name sits left of its bar when there is room, else on its own line above it.
  const stacked = nameW + 12 > W * 0.4 || nameW + 18 + stateW > W;
  const x0 = stacked ? 1 : Math.ceil(nameW) + 12;
  const plot = Math.max(40, W - right - x0);
  const x = v => x0 + Math.max(0, Math.min(1, v)) * plot;
  const rowH = stacked ? 44 : 30, ticks = [0, .25, .5, .75, 1];
  let H = 0;
  for (const f of c.facets) H += (f.title ? 26 : 0) + f.rows.length * rowH;
  H += 22;
  const g = svg("svg", { class: c.lower_is_better ? "mchart lower-better" : "mchart", viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "group", "aria-label": c.lower_is_better ? `${c.title} (lower is better)` : c.title });
  let y = 0;
  for (const f of c.facets) {
    if (f.title) { g.append(svg("text", { x: 0, y: y + 16, class: "facet" }, f.title)); y += 26; }
    const top = y, bottom = y + f.rows.length * rowH;
    for (const r of f.rows) {
      const where = f.title ? `${f.title}, ` : "";
      const tipText = `${where}${r.tool}: ${r.text}`;
      const row = svg("g", { class: "mrow", tabindex: 0, role: "img", "aria-label": tipText, "data-tip": tipText });
      row.append(svg("rect", { class: "hit", x: 0, y: y + 1, width: W, height: rowH - 2, rx: 4 }));
      const barY = stacked ? y + 22 : y + rowH / 2 - 7;
      const textY = barY + 11;
      row.append(svg("text", stacked ? { x: 0, y: y + 15 } : { x: x0 - 12, y: textY, "text-anchor": "end" }, r.tool));
      if (r.value === null || r.value === undefined) {
        row.append(svg("text", { x: x0 + 6, y: textY, class: "state" }, r.text));
      } else {
        const w = x(r.value) - x0;
        row.append(w > 0 ? svg("path", { class: "mbar", d: barPath(x0, barY, w, 14) })
          : svg("rect", { class: "mbar", x: x0, y: barY, width: 2, height: 14 }));
        row.append(svg("text", { x: x0 + Math.max(w, 2) + 6, y: textY }, r.text));
      }
      g.append(row);
      y += rowH;
    }
    // Gridlines behind the rows: drawn after them, then moved first. When names sit above the
    // bars, the lines only run through the bar bands, so they never cross a name.
    const spans = stacked ? f.rows.map((_, i) => [top + i * rowH + 19, top + i * rowH + 39]) : [[top, bottom]];
    const lines = spans.flatMap(([y1, y2]) => ticks.map(tk => svg("line", { x1: x(tk), x2: x(tk), y1, y2, class: tk === 0 ? "axis" : "grid", "stroke-width": 1 })));
    g.insertBefore(svg("g", { "aria-hidden": "true" }, lines), g.firstChild);
  }
  ticks.forEach(tk => g.append(svg("text", { x: x(tk), y: y + 16, class: "tick", "text-anchor": tk === 0 && stacked ? "start" : tk === 1 ? "end" : "middle", "aria-hidden": "true" }, `${Math.round(tk * 100)}%`)));
  return g;
}
function renderMeasureCharts(s) {
  if (!(s.charts || []).length) return null;
  const app = document.getElementById("app");
  const W = Math.max(260, Math.min(760, (app.clientWidth || 760) - (innerWidth <= 640 ? 30 : 42)));
  const groups = [];
  for (const c of s.charts) {
    const last = groups.at(-1);
    if (last && last.name === c.group) last.charts.push(c); else groups.push({ name: c.group, charts: [c] });
  }
  return section("measures", null, "Measurements at a glance", s.charts_intro || null,
    groups.map(gr => el("div", { class: "mgroup" },
      el("div", { class: "kicker" }, gr.name),
      gr.charts.map(c => [el("div", { class: "mchart-title" }, c.title, c.lower_is_better ? el("span", { class: "mtag" }, "lower is better") : null), el("p", { class: "mcap" }, c.caption), measureChart(c, W)]))));
}

// The reviewer views start folded. They open on "Show details", on a link to one of them, or
// when the page is opened on one, and stay as the reader left them when a chip re-renders.
let detailsOpen = null;
const hashInDetails = () => { const id = location.hash.slice(1); return !!id && id !== "summary" && !["first", "tested", "glance", "measures", "meaning", "words"].includes(id); };
function openDetails() {
  detailsOpen = true;
  const d = document.getElementById("details-body");
  if (d && !d.open) d.open = true;
}
document.querySelector("nav.sections").addEventListener("click", e => {
  const a = e.target.closest("a");
  if (a && a.getAttribute("href") !== "#summary") openDetails();
});
addEventListener("hashchange", () => { if (hashInDetails()) openDetails(); });

function render() {
  const app = document.getElementById("app");
  const y = window.scrollY;
  const current = document.getElementById("details-body");
  if (current) detailsOpen = current.open;
  const views = [renderHeader(), renderVersions(), renderM1(), renderM2(), renderM3(), renderM4(), renderNegatives(), renderFamilies(), renderTaxonomy(), renderOutput(), renderMethod()];
  const footer = el("footer", {}, "Generated by tools/eval_report.py from Harbor jobs. Schema ", DATA.schema || "sast-eval-report/2", ".");
  const summary = renderSummary();
  if (!summary) {
    // An older payload without a summary: the reviewer views are the whole page.
    app.replaceChildren(...views, footer);
  } else {
    if (detailsOpen === null) detailsOpen = hashInDetails();
    const s = DATA.summary;
    const label = el("span", {}, detailsOpen ? "Hide details" : "Show details");
    const body = el("details", { class: "reviewers-body", id: "details-body", open: detailsOpen },
      el("summary", {}, el("span", { class: "caret", "aria-hidden": "true" }, "▸"), label), views);
    body.addEventListener("toggle", () => { detailsOpen = body.open; label.textContent = body.open ? "Hide details" : "Show details"; });
    app.replaceChildren(summary,
      el("section", { class: "reviewers", id: "details", "aria-labelledby": "details-h" },
        el("h2", { id: "details-h" }, s.details_title || "Details for reviewers"),
        el("p", { class: "lede" }, s.details_intro || ""),
        body),
      footer);
  }
  window.scrollTo(0, y);
}

let resizeTimer = null, lastWidth = innerWidth;
addEventListener("resize", () => {
  if (!DATA || Math.abs(innerWidth - lastWidth) < 40) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { lastWidth = innerWidth; render(); }, 200);
});

loadData().then(d => d ? start(d) : showPicker()).catch(e => showPicker("Could not load the report: " + e.message));
