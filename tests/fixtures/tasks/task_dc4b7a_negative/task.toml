version = "1.0"

[metadata]
author_name = "Turing"
category = "security-static-analysis"
tags = ["owasp-llm-2026", "static-scanner-eval"]
difficulty = "hard"

# Spec 5.2 task-level fields (non-label)
schema_version = "0.1"
task_id = "task_dc4b7a_negative"
repository_id = "repo_crewaiinc_crewai"
family_id = "fam_1934"
variant_id = "var_a"
related_variant_ids = ["fam_1934:var_b"]
source_origin = "adapted_open_source"
source_url = "https://github.com/crewAIInc/crewAI"
source_commit = "25e7ca03c4618b5e3a8e2c999ee2952107ff67e5"
license = "MIT"
modifications = "Same package as the positive twin with the URL half of upstream 9325e2f, the loader change of 3dc8c45 and the pinned fetch of 9b1f4938 applied, plus the extra checks recorded in provenance."
languages = ["python"]
frameworks = ["crewai"]
package_versions = { python = ">=3.10", crewai-tools = "1.15.17" }
architecture = "single-agent supplier research assistant with a RAG website search tool"
