# Test-only task for the scanner agents (not part of the dataset): a recording target for SonarQube. A tiny
# notes helper whose code SonarQube Community's Python rules should flag both as a VULNERABILITY (clear-text
# HTTP, python:S5332) and as Security Hotspots (shell command, formatted SQL, loose file permissions).
version = "1.0"

[metadata]
author_name = "Turing"
category = "security-static-analysis"
tags = ["owasp-llm-2026", "static-scanner-eval", "scanner-agent-dev"]
difficulty = "easy"
task_id = "dev_smoke_sonar"
scanner_roots = ["src"]
excluded_paths = ["tests"]

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
