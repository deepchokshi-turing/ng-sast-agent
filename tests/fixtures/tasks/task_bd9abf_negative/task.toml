version = "1.0"

[metadata]
author_name = "Turing"
category = "security-static-analysis"
tags = ["owasp-llm-2026", "static-scanner-eval"]
difficulty = "hard"

# Spec 5.2 task-level fields (non-label)
schema_version = "0.1"
task_id = "task_bd9abf_negative"
repository_id = "repo_crewaiinc_crewai"
family_id = "fam_84d8"
variant_id = "var_a"
related_variant_ids = ["fam_84d8:var_b"]
source_origin = "adapted_open_source"
source_url = "https://github.com/crewAIInc/crewAI"
source_commit = "e1d7de0dbadcadb3ac485565b35f1d89ce1c2cf7"
license = "MIT"
modifications = "Same package as the positive twin with the code_interpreter_tool.py hunks of upstream fb2323b applied and their docstrings reworded neutrally."
languages = ["python"]
frameworks = ["crewai"]
package_versions = { python = ">=3.10", crewai-tools = "1.11.0" }
architecture = "single-agent analysis helper with a code execution tool"
entrypoint = "python -m crewai_codeint_mini \"<request>\""
build_command = "python -m compileall -q src"
test_command = "python -m unittest discover -s tests -q"
scanner_roots = ["src", "config", "fixtures", "security_manifest.json", "pyproject.toml"]
excluded_paths = ["tests"]

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
