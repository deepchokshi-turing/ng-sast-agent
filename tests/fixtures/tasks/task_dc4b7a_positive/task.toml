version = "1.0"

[metadata]
author_name = "Turing"
category = "security-static-analysis"
tags = ["owasp-llm-2026", "static-scanner-eval"]
difficulty = "hard"

# Spec 5.2 task-level fields (non-label)
schema_version = "0.1"
task_id = "task_dc4b7a_positive"
repository_id = "repo_crewaiinc_crewai"
family_id = "fam_1934"
variant_id = "var_b"
related_variant_ids = ["fam_1934:var_a"]
source_origin = "adapted_open_source"
source_url = "https://github.com/crewAIInc/crewAI"
source_commit = "25e7ca03c4618b5e3a8e2c999ee2952107ff67e5"
license = "MIT"
modifications = "WebsiteSearchTool, RagTool and the web loaders of crewAI tools at 25e7ca0 extracted into crewai_rag_web_mini with stdlib requests shims, a stub model and a supplier research app."
languages = ["python"]
frameworks = ["crewai"]
package_versions = { python = ">=3.10", crewai-tools = "1.14.0a4" }
architecture = "single-agent supplier research assistant with a RAG website search tool"
entrypoint = "python -m crewai_rag_web_mini \"<question>\""
build_command = "python -m compileall -q src"
test_command = "python -m unittest discover -s tests -q"
scanner_roots = ["src", "config", "fixtures", "security_manifest.json", "pyproject.toml"]
excluded_paths = ["tests"]

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
