# Development only. The eval platform puts this repository on Harbor's PYTHONPATH
# and installs nothing, so runtime code (sast/) may import only the standard
# library and harbor.
[project]
name = "sast-agents"
version = "0.2.0"
description = "Static-analysis scanners (no LLM) as Harbor agents"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["harbor==0.23.0", "pytest>=8", "ruamel.yaml==0.19.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
